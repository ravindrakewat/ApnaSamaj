<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="centerFigGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="leftFigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="rightFigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="laurelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldRing)" stroke-width="6" opacity="0.5" stroke-dasharray="16 10" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2" />

  <g opacity="0.3" stroke="#FDE047" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="60" x2="256" y2="82" />
    <line x1="202" y1="74" x2="214" y2="92" />
    <line x1="310" y1="74" x2="298" y2="92" />
    <line x1="158" y1="108" x2="174" y2="122" />
    <line x1="354" y1="108" x2="338" y2="122" />
  </g>

  <g filter="url(#glow)">
    <circle cx="256" cy="100" r="18" fill="url(#goldRing)" />
    <path d="M256,76 C242,92 242,106 256,118 C270,106 270,92 256,76 Z" fill="#FEF08A" />
    <path d="M240,86 C230,98 232,112 246,116 C242,104 242,94 240,86 Z" fill="#F59E0B" />
    <path d="M272,86 C282,98 280,112 266,116 C270,104 270,94 272,86 Z" fill="#F59E0B" />
  </g>

  <!-- Central Unity Figures -->
  <circle cx="256" cy="172" r="34" fill="url(#centerFigGrad)" filter="url(#glow)" />
  <path d="M210,292 C210,244 230,224 256,224 C282,224 302,244 302,292 C302,304 292,312 280,312 L232,312 C220,312 210,304 210,292 Z" fill="url(#centerFigGrad)" />

  <circle cx="168" cy="204" r="28" fill="url(#leftFigGrad)" />
  <path d="M124,306 C124,264 142,246 168,246 C188,246 202,258 210,276 C202,290 202,304 204,312 L144,312 C132,312 124,308 124,306 Z" fill="url(#leftFigGrad)" />

  <circle cx="344" cy="204" r="28" fill="url(#rightFigGrad)" />
  <path d="M388,306 C388,264 370,246 344,246 C324,246 310,258 302,276 C310,290 310,304 308,312 L368,312 C380,312 388,308 388,306 Z" fill="url(#rightFigGrad)" />

  <!-- Interlocking Arms -->
  <path d="M134,310 C170,350 342,350 378,310 C386,302 396,308 392,318 C352,370 160,370 120,318 C116,308 126,302 134,310 Z" fill="url(#goldRing)" filter="url(#glow)" />

  <!-- Base Harmony Ribbon -->
  <path d="M156,380 C220,406 292,406 356,380 C366,376 376,384 370,394 C338,428 174,428 142,394 C136,384 146,376 156,380 Z" fill="url(#laurelGrad)" />

  <circle cx="256" cy="410" r="5" fill="#FDE047" />
  <circle cx="232" cy="407" r="3.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="280" cy="407" r="3.5" fill="#FFFFFF" opacity="0.8" />
</svg>